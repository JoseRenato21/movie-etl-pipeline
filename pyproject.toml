[project]
name = "movie-etl-pipeline"
version = "0.1.0"
description = "Pipeline ELT em arquitetura medalhão (Bronze, Silver, Gold) com Python, PostgreSQL e dbt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "dbt-postgres>=1.11.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
